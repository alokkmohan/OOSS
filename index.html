<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Out-of-School Student Tracking — UP Education Dept.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1c3866; --navy-dark: #142845; --bg: #f1f5f9; --card: #ffffff;
      --border: rgba(15,23,42,0.1); --text: #0f172a; --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
      text-align: center;
    }
    h1 { font-size: 1.6rem; color: var(--navy); margin-bottom: 8px; }
    p.sub { color: var(--muted); font-size: 0.95rem; max-width: 480px; margin-bottom: 32px; }
    .links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .link-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 24px 32px; min-width: 200px; text-decoration: none; color: var(--text);
      box-shadow: 0 1px 3px rgba(15,23,42,0.06); transition: transform 0.15s, box-shadow 0.15s;
    }
    .link-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(15,23,42,0.1); }
    .link-card .title { font-weight: 700; color: var(--navy); font-size: 1.05rem; margin-bottom: 6px; }
    .link-card .desc { font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Out-of-School Student Tracking</h1>
  <p class="sub">Uttar Pradesh Secondary Education Department — Dropout Tracking & Classification System</p>
  <div class="links">
    <a class="link-card" href="/collect/">
      <div class="title">Field Data Collection</div>
      <div class="desc">Record student status by district and school</div>
    </a>
    <a class="link-card" href="/dashboard/">
      <div class="title">Live Dashboard</div>
      <div class="desc">Real-time verification and status summary</div>
    </a>
  </div>
</body>
</html>
